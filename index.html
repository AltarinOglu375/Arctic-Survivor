<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1d2a" />
    <title>Arctic Survivor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- HUD -->
      <div id="hud" class="hud">
        <div class="stat" title="Para">
          <span class="ico">$</span><span id="hudMoney">0</span>
        </div>
        <div class="stat" title="Odun">
          <span class="ico ico-wood"></span><span id="hudWood">0</span>
        </div>
        <div class="stat" title="Et">
          <span class="ico ico-meat"></span><span id="hudMeat">0</span>
        </div>
        <div class="stat" title="Balta seviyesi">
          <span class="ico ico-axe"></span><span id="hudAxe">1</span>
        </div>
        <div class="stat base" title="Üs canı">
          <span class="ico ico-base"></span>
          <div class="bar"><div id="hudBaseBar" class="bar-fill"></div></div>
        </div>
        <div class="stat" title="Skor">
          <span class="ico ico-score">🏆</span><span id="hudScore">0</span>
        </div>
      </div>

      <!-- Joystick -->
      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>

      <!-- Pause Button -->
      <button id="btnPause" class="btn-pause" aria-label="Duraklat">⏸</button>

      <!-- Action button -->
      <button id="btnAction" class="btn-action" aria-label="Saldır / Topla">
        <span>⚔</span>
      </button>

      <!-- Shop / Market -->
      <div id="shop" class="shop hidden">
        <div class="shop-card">
          <header>
            <h2 id="shopTitle">Market</h2>
            <button id="shopClose" class="x">×</button>
          </header>
          <div id="shopBody" class="shop-body"></div>
        </div>
      </div>

      <!-- Placement bar -->
      <div id="placeBar" class="place-bar hidden">
        <span id="placeBarText">Üs içinde bir yere dokun</span>
        <button id="placeCancel">İptal</button>
      </div>


      <!-- Toast -->
      <div id="toast" class="toast"></div>

      <!-- Pause Menu -->
      <div id="pauseMenu" class="pause-menu hidden">
        <div class="pause-card">
          <h2>Oyun Duraklatıldı</h2>
          <div class="pause-actions">
            <button id="btnResume" class="btn-primary">Devam Et</button>
            <button id="btnSettings" class="btn-secondary">Ayarlar</button>
            <button id="btnToLobby" class="btn-secondary danger">Lobiye Dön</button>
          </div>
        </div>
      </div>

      <!-- Start screen (Lobby) -->
      <div id="start" class="start">
        <div class="start-card">
          <h1>Arctic Survivor</h1>
          
          <div class="lobby-section">
            <input type="text" id="inputNickname" placeholder="Kullanıcı Adı" maxlength="15" />
          </div>

          <div class="lobby-section">
            <h3>Karakter Seçimi</h3>
            <div class="skin-selector">
              <button id="skinPrev" class="skin-btn">◀</button>
              <div class="skin-display">
                <div id="skinIcon" class="skin-preview">🧍</div>
                <div id="skinName">Standart</div>
                <div id="skinPrice" class="skin-price">Ücretsiz</div>
              </div>
              <button id="skinNext" class="skin-btn">▶</button>
            </div>
            <button id="btnBuySkin" class="btn-secondary hidden">Satın Al</button>
            <button id="btnSelectSkin" class="btn-secondary hidden">Seç</button>
          </div>

          <div class="lobby-section leaderboard">
            <h3>En İyiler (Yerel)</h3>
            <ul id="leaderboardList">
              <!-- Populated by JS -->
            </ul>
          </div>

          <p class="tutorial-text">
            <b>Joystick</b> hareket | <b>⚔</b> saldır/topla | <b>Tezgâhlar</b> market
          </p>

          <button id="btnStart" class="btn-primary">Oyuna Başla</button>
          <br />
          <button id="btnReset" class="btn-link">Tüm ilerlemeyi sıfırla</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
